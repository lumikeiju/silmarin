#region Meta
[project]
site_name = "Silmärin"
site_description = "Lumikeiju's knowledge base."
site_author = "Lumikeiju"
site_url = "https://lumikeiju.dev/silmarin/"
repo_name = "Lumikeiju/Silmärin"
repo_url = "https://github.com/Lumikeiju/silmarin"
copyright = "&copy; 2026 Lumikeiju"
extra_css = [
    "stylesheets/extra.css",
    "https://unpkg.com/katex@0/dist/katex.min.css",
    "https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/styles.css"
]
extra_javascript = [
    "javascripts/extra.js",
    "javascripts/katex.js",
    "https://unpkg.com/katex@0/dist/katex.min.js",
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
    "https://cdn.jsdelivr.net/npm/img-comparison-slider@8/dist/index.js"
]

#region Theme
[project.theme]
custom_dir = "overrides"
favicon = "resources/images/favicon/favicon.png"
language = "en"
logo = "resources/images/logo/logo.png"
features = [
    "announce.dismiss",
    #"content.action.edit",
    #"content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    #"header.autohide",
    #"navigation.expand",
    #"navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    #"navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    #"navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    #"search.highlight",
    "toc.follow"
    #"toc.integrate"
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.theme.font]
text = "Atkinson Hyperlegible Next"
code = "Atkinson Hyperlegible Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

#region Extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
#[project.markdown_extensions.def_list]
#[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
title = "On this page:"
permalink = "⚓︎"
permalink_title = "Anchor link to this section"
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
auto_append = [ "includes/abbreviations.md" ]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    {name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format"}
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

